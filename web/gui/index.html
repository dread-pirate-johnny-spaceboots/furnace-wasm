<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Furnace GUI Web</title>
  <style>
    :root {
      background: #0a0d10;
      color: #e6ecef;
      font-family: "IBM Plex Mono", monospace;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(80, 145, 169, 0.18), transparent 40%),
        linear-gradient(180deg, #0c1216 0%, #090c0f 100%);
    }

    body {
      position: relative;
    }

    #shell {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #furnace-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: #050607;
    }

    #status {
      position: absolute;
      inset: 0 auto auto 0;
      max-width: min(42rem, calc(100% - 2rem));
      margin: 1rem;
      padding: 0.85rem 1rem;
      border: 1px solid rgba(202, 231, 255, 0.18);
      background: rgba(10, 15, 20, 0.88);
      backdrop-filter: blur(12px);
      line-height: 1.45;
      white-space: pre-wrap;
      pointer-events: none;
    }

    #status[data-state="error"] {
      border-color: rgba(255, 148, 148, 0.35);
      color: #ffd4d4;
    }

    #status[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div id="shell">
    <canvas id="furnace-canvas" tabindex="0"></canvas>
    <div id="status">Booting Furnace GUI...</div>
  </div>
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
